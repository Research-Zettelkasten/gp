name: Portal update checks
on:
  push:
    branches: [codex/home-navigation-admin-clock-out-20261116, codex/fix-clock-out-text-hours-20261117]
  pull_request:
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'supabase/migrations/**'
      - 'tests/**'
      - '.github/workflows/portal-update-checks.yml'
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: gp_clock_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-password
      PGDATABASE: gp_clock_test
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript, permissions, and asset checks
        run: node --test tests/portal-core.test.cjs tests/collections-core.test.cjs tests/customers-core.test.cjs tests/time-week.test.cjs
      - name: Collections and quote database integration
        run: |
          createdb gp_collections_test
          PGDATABASE=gp_collections_test psql -X -v ON_ERROR_STOP=1 -f tests/collections.sql
      - name: Customer registry and reconciliation integration
        run: |
          createdb gp_customer_test
          PGDATABASE=gp_customer_test psql -X -v ON_ERROR_STOP=1 -f tests/customers.sql
      - name: Atomic clock-out and rollback tests
        run: psql -X -v ON_ERROR_STOP=1 -f tests/clock-out.sql
      - name: Concurrent employee and administrator clock-out
        run: node tests/clock-race.cjs
      - name: Legacy text-hours compatibility regression
        run: psql -X -v ON_ERROR_STOP=1 -f tests/clock-out-text-hours.sql
      - name: Missed clock-out policy and saved-timecard recovery
        run: psql -X -v ON_ERROR_STOP=1 -f tests/auto-clock-out.sql
      - name: Install browser test runner
        timeout-minutes: 3
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          gp_browser_path="$(command -v google-chrome || command -v google-chrome-stable)"
          test -n "$gp_browser_path"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$gp_browser_path" >> "$GITHUB_ENV"
      - name: Responsive browser checks
        run: node tests/browser.cjs
      - name: Collections and quote browser workflows
        run: node tests/collections-browser.cjs
      - name: Customer registry browser workflows
        run: node tests/customers-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-layout-previews
          path: test-results/
          if-no-files-found: ignore

